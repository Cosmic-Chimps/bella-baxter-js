name: Promote npm `latest` dist-tag

# Repair path for the state bella-baxter#732 describes: versions that are published
# but that `latest` never moved onto. Runs the same rule publish.yml runs, so the two
# can never disagree about when a prerelease may hold `latest`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published version to promote (e.g. 0.1.1-preview.102)'
        required: true
        type: string
      dry_run:
        description: 'Report the decision without touching any dist-tag'
        required: false
        default: false
        type: boolean

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Promote
        run: |
          python3 scripts/promote-dist-tag.py "${{ inputs.version }}" \
            kiota-client sdk express nestjs next fastify adonis \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
